[project]
name = "avukat-dosya-takip"
version = "0.1.0"
description = "Hukuk dava dosyaları için kaynaklı belge analizi (MVP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    # OCR: PDF sayfasını görüntüye çevirmek için. Tesseract ayrıca kurulur (bkz. docs/devir-notu.md)
    "pypdfium2>=4.30",
    "pillow>=10",
    "numpy>=1.26",
    # Parola özetleme (Argon2id)
    "argon2-cffi>=23.1",
    # Müvekkil bilgisinin uygulama katmanında şifrelenmesi (AES-GCM, HKDF, HMAC)
    "cryptography>=42",
    # Dil modeli sağlayıcılarıyla (yerel Ollama) konuşmak için
    "httpx>=0.27",
]

[project.optional-dependencies]
# fpdf2 yalnızca testlerde sentetik PDF üretmek için kullanılır
dev = ["pytest>=8", "fpdf2>=2.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
